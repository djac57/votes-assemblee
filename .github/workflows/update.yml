name: Mise à jour et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"  # chaque lundi à 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger l'open data de l'Assemblée
        continue-on-error: true   # source externe en panne : on garde les dernières données, le site se déploie quand même
        run: python scripts/fetch.py raw

      - name: Construire data.js
        continue-on-error: true
        run: python scripts/build.py raw

      - name: Committer les nouvelles données
        continue-on-error: true   # un échec d'envoi ne doit JAMAIS empêcher le déploiement du site
        run: |
          if [ -z "$(git status --porcelain site)" ]; then echo "Aucune nouvelle donnée."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Données Assemblée mises à jour ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Envoi refusé, nouvel essai ($i)…"; sleep $((i * 5))
          done
          echo "::warning::Données non poussées après 3 essais (le site est tout de même déployé)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
